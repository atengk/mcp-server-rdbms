name: 发布到 PyPI 与 GitHub Release (Release Pipeline)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  # -------------------------------------------------------------
  # Job 1: 质量门禁检查 (Test & Lint Guard)
  # -------------------------------------------------------------
  quality-check:
    name: 运行代码规范与自动化测试门禁
    runs-on: ubuntu-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装 uv 依赖管理工具
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: 安装 Python 运行环境
        run: uv python install 3.12

      - name: 运行 ruff 静态语法检查
        run: uv run ruff check

      - name: 运行全量单元测试
        run: uv run pytest -v

  # -------------------------------------------------------------
  # Job 2: 打包、创建 Release 与发布至 PyPI
  # -------------------------------------------------------------
  publish:
    name: 构建打包与多渠道发布
    needs: quality-check
    runs-on: ubuntu-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装 uv 依赖管理工具
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: 安装 Python 运行环境
        run: uv python install 3.12

      - name: 构建标准分发产物 (Wheel & Sdist)
        run: uv build

      - name: 提取 Release Notes 结构化发版说明
        id: extract_notes
        run: |
          python -c '
          import re
          from pathlib import Path

          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          # 提取首个版本块
          match = re.search(r"##\s+\[(.*?)\]\s*-\s*\d{4}-\d{2}-\d{2}\s*\n(.*?)(?=\n##\s+\[|\Z)", changelog, re.DOTALL)
          if match:
              version, notes = match.groups()
              Path("RELEASE_BODY.md").write_text(notes.strip(), encoding="utf-8")
          else:
              Path("RELEASE_BODY.md").write_text("正式版本发布。详情请查阅 CHANGELOG.md。", encoding="utf-8")
          '

      - name: 计算产物 SHA-256 校验和并追加至 Release 说明
        run: |
          echo -e "\n\n### 📦 分发产物校验和 (SHA-256 Checksums)" >> RELEASE_BODY.md
          echo '```text' >> RELEASE_BODY.md
          sha256sum dist/* >> RELEASE_BODY.md
          echo '```' >> RELEASE_BODY.md

      - name: 创建 GitHub Release 并上传分发资产
        uses: softprops/action-gh-release@v2
        with:
          name: "atengk-mcp-server-rdbms ${{ github.ref_name }}"
          body_path: RELEASE_BODY.md
          files: dist/*
          draft: false
          prerelease: false

      - name: 自动发布到 PyPI (支持 Trusted Publishing 或 API Token)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          # 若配置了 PYPI_API_TOKEN 则使用 Token，否则自动走 OIDC Trusted Publisher
          password: ${{ secrets.PYPI_API_TOKEN }}
